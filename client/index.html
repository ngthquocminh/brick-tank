<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1d1f">
<title>Brick Tank</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <div id="dpad" class="pad">
    <button class="b up" data-dir="1" aria-label="Lên"></button>
    <button class="b left" data-dir="4" aria-label="Trái"></button>
    <button class="b right" data-dir="2" aria-label="Phải"></button>
    <button class="b down" data-dir="3" aria-label="Xuống"></button>
  </div>
  <section id="game">
    <div id="screen">
      <canvas id="lcd"></canvas>
      <form id="start">
        <h1>BRICK TANK</h1>
        <input id="name" maxlength="10" placeholder="TÊN" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="submit">PLAY</button>
        <p>Mũi tên/WASD để đi · SPACE để bắn<br>Trúng 1 viên là chết</p>
      </form>
    </div>
    <canvas id="panel"></canvas>
  </section>
  <div id="firepad" class="pad">
    <button class="b fire" data-fire="1" aria-label="Bắn"></button>
    <span>FIRE</span>
  </div>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
